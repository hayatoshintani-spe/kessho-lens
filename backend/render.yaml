services:
  - type: web
    name: kessho-lens-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
