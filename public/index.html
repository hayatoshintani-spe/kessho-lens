<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>決算レンズ — AI アナリスト</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0B0E14; color: #E2DDD5; font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @keyframes fadeIn  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    input::placeholder { color: #484C57; }
    input { caret-color: #C8860A; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── カラーパレット ───────────────────────────────────────────────
const C = {
  bg: '#0B0E14', sidebar: '#0F1219', card: '#141922', cardHover: '#181F2B',
  border: 'rgba(255,255,255,0.07)', borderAccent: 'rgba(200,134,10,0.35)',
  textPrimary: '#E2DDD5', textSecondary: '#7B7F8C', textTertiary: '#484C57',
  accent: '#C8860A', accentLight: 'rgba(200,134,10,0.12)',
  green: '#1D9E75', greenLight: 'rgba(29,158,117,0.12)',
  red: '#D85A30', redLight: 'rgba(216,90,48,0.12)',
  blue: '#378ADD', blueLight: 'rgba(55,138,221,0.12)',
};

const ratingConfig = {
  beat:   { label: '上回る', bg: C.greenLight, color: C.green },
  miss:   { label: '下回る', bg: C.redLight,   color: C.red   },
  inline: { label: '想定内', bg: 'rgba(255,255,255,0.06)', color: C.textSecondary },
};

const QUICK_QUESTIONS = [
  'この会社の一番の強みは何ですか？',
  '今後3年の成長シナリオを教えてください',
  '競合他社と比べてどうですか？',
  '最大のリスクは何ですか？',
  '長期保有の観点で評価してください',
];

// ── SSEストリーミング関数 ────────────────────────────────────────
async function streamChat({ messages, systemPrompt, apiKey, onChunk }) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, systemPrompt, apiKey }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'サーバーエラー' }));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  const reader  = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '';
  let buf  = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') return full;
      try {
        const p = JSON.parse(data);
        if (p.error) throw new Error(p.error);
        if (p.text) { full += p.text; onChunk(full); }
      } catch (e) { if (e.message) throw e; }
    }
  }
  return full;
}

// ── コンポーネント: スコアバー ───────────────────────────────────
function ScoreBar({ score }) {
  const color = score >= 85 ? C.green : score >= 70 ? C.accent : score >= 55 ? C.blue : C.red;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
      <div style={{ flex:1, height:3, background:'rgba(255,255,255,0.08)', borderRadius:2 }}>
        <div style={{ width:`${score}%`, height:'100%', background:color, borderRadius:2, transition:'width 0.6s ease' }} />
      </div>
      <span style={{ fontSize:13, fontWeight:500, color, minWidth:28 }}>{score}</span>
    </div>
  );
}

// ── コンポーネント: 点滅カーソル ─────────────────────────────────
function Cursor() {
  const [v, setV] = useState(true);
  useEffect(() => { const t = setInterval(() => setV(x=>!x), 530); return () => clearInterval(t); }, []);
  return <span style={{ opacity:v?1:0, color:C.accent }}>▋</span>;
}

// ── コンポーネント: Markdownレンダリング ─────────────────────────
function MD({ text }) {
  return (
    <div style={{ lineHeight:1.85, fontSize:13.5, color:C.textPrimary }}>
      {text.split('\n').map((line, i) => {
        if (line.startsWith('### ')) return <div key={i} style={{ fontWeight:700, fontSize:14, color:C.textPrimary, marginTop:14, marginBottom:4 }}>{line.slice(4)}</div>;
        if (line.startsWith('## '))  return <div key={i} style={{ fontWeight:700, fontSize:15, color:C.textPrimary, marginTop:16, marginBottom:6 }}>{line.slice(3)}</div>;
        if (line.startsWith('- ') || line.startsWith('• ')) return (
          <div key={i} style={{ display:'flex', gap:8, marginTop:5, paddingLeft:4 }}>
            <span style={{ color:C.accent, flexShrink:0, marginTop:1 }}>·</span>
            <span style={{ color:C.textSecondary }}>{renderInline(line.slice(2))}</span>
          </div>
        );
        if (/^\d+\.\s/.test(line)) return (
          <div key={i} style={{ display:'flex', gap:8, marginTop:5, paddingLeft:4 }}>
            <span style={{ color:C.accent, flexShrink:0, fontWeight:500, fontSize:12 }}>{line.match(/^\d+/)[0]}.</span>
            <span style={{ color:C.textSecondary }}>{renderInline(line.replace(/^\d+\.\s/,''))}</span>
          </div>
        );
        if (line.trim() === '') return <div key={i} style={{ height:6 }} />;
        return <div key={i} style={{ color:C.textSecondary, marginTop:3 }}>{renderInline(line)}</div>;
      })}
    </div>
  );
}

function renderInline(text) {
  const parts = text.split(/\*\*(.*?)\*\*/g);
  if (parts.length === 1) return text;
  return parts.map((p, i) => i % 2 === 1 ? <strong key={i} style={{ color:C.textPrimary, fontWeight:600 }}>{p}</strong> : p);
}

// ── コンポーネント: ローディングスピナー ─────────────────────────
function Spinner({ size=16, color=C.accent }) {
  return <div style={{ width:size, height:size, border:`2px solid rgba(255,255,255,0.1)`, borderTopColor:color, borderRadius:'50%', animation:'spin 0.8s linear infinite', flexShrink:0 }} />;
}

// ── コンポーネント: 設定モーダル ─────────────────────────────────
function SettingsModal({ apiKey, onSave, onClose }) {
  const [val, setVal] = useState(apiKey || '');
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:100, display:'flex', alignItems:'center', justifyContent:'center' }} onClick={onClose}>
      <div style={{ background:C.card, border:`0.5px solid ${C.border}`, borderRadius:16, padding:28, width:440, maxWidth:'90vw', animation:'fadeIn 0.2s ease' }} onClick={e=>e.stopPropagation()}>
        <div style={{ fontSize:16, fontWeight:600, color:C.textPrimary, marginBottom:6 }}>⚙️ 設定</div>
        <div style={{ fontSize:12, color:C.textTertiary, marginBottom:20 }}>
          Claude API キーを入力してください。<br/>
          取得先: <a href="https://console.anthropic.com/" target="_blank" style={{ color:C.accent }}>console.anthropic.com</a>
        </div>
        <label style={{ fontSize:11, color:C.textTertiary, display:'block', marginBottom:6 }}>ANTHROPIC_API_KEY</label>
        <input
          type="password"
          value={val}
          onChange={e => setVal(e.target.value)}
          placeholder="sk-ant-xxxxxxxxxxxxxxxx"
          style={{ width:'100%', background:'rgba(255,255,255,0.04)', border:`0.5px solid ${C.border}`, borderRadius:8, padding:'10px 14px', color:C.textPrimary, fontSize:13, outline:'none', fontFamily:'monospace' }}
          onFocus={e => e.target.style.borderColor = C.accent}
          onBlur={e  => e.target.style.borderColor = C.border}
        />
        <div style={{ display:'flex', gap:8, marginTop:16, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'8px 16px', borderRadius:8, background:'transparent', border:`0.5px solid ${C.border}`, color:C.textSecondary, cursor:'pointer', fontSize:13 }}>
            キャンセル
          </button>
          <button onClick={() => { onSave(val.trim()); onClose(); }} style={{ padding:'8px 20px', borderRadius:8, background:C.accent, border:'none', color:'white', cursor:'pointer', fontSize:13, fontWeight:500 }}>
            保存
          </button>
        </div>
      </div>
    </div>
  );
}

// ── メインアプリ ─────────────────────────────────────────────────
export default function KesshoApp() {
  const [companies,     setCompanies]     = useState([]);
  const [dataLoading,   setDataLoading]   = useState(true);
  const [dataError,     setDataError]     = useState(null);
  const [lastUpdated,   setLastUpdated]   = useState(null);
  const [refreshing,    setRefreshing]    = useState(false);

  const [company,       setCompany]       = useState(null);
  const [tab,           setTab]           = useState('chat');
  const [chatMsgs,      setChatMsgs]      = useState([]);
  const [chatInput,     setChatInput]     = useState('');
  const [loading,       setLoading]       = useState(false);
  const [streaming,     setStreaming]     = useState('');
  const [report,        setReport]        = useState('');
  const [reportLoading, setReportLoading] = useState(false);
  const [currentTab,    setCurrentTab]    = useState(null);

  const [apiKey,        setApiKey]        = useState(() => localStorage.getItem('kessho_api_key') || '');
  const [settingsOpen,  setSettingsOpen]  = useState(false);

  const bottomRef   = useRef(null);
  const stopRef     = useRef(null);

  // 初回データ取得
  useEffect(() => {
    fetchCompanies();
  }, []);

  async function fetchCompanies() {
    setDataLoading(true);
    setDataError(null);
    try {
      const res  = await fetch('/api/companies');
      const data = await res.json();
      if (data.companies && data.companies.length > 0) {
        setCompanies(data.companies);
        setCompany(data.companies[0]);
        setLastUpdated(data.lastUpdated);
      } else {
        setDataError('データがありません。サーバーを再起動してください。');
      }
    } catch (e) {
      setDataError('サーバーに接続できません。start.bat でサーバーが起動しているか確認してください。');
    }
    setDataLoading(false);
  }

  async function handleRefresh() {
    setRefreshing(true);
    try {
      const res  = await fetch('/api/refresh');
      const data = await res.json();
      if (data.success) {
        await fetchCompanies();
      }
    } catch {}
    setRefreshing(false);
  }

  // 銘柄切替時にリセット
  useEffect(() => {
    if (!company) return;
    setChatMsgs([]); setStreaming(''); setLoading(false);
    setReport('');   setReportLoading(false); setCurrentTab(null);
    setTab('chat');
    if (stopRef.current) stopRef.current();
  }, [company?.id]);

  // スクロール
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [chatMsgs, streaming]);

  function saveApiKey(key) {
    setApiKey(key);
    if (key) localStorage.setItem('kessho_api_key', key);
    else     localStorage.removeItem('kessho_api_key');
  }

  function buildSystemPrompt(c) {
    return `あなたは「6��算レンズ」専属のAI投資アナリストです。日本の上場企業の決算・財務分析・成長可能性について、プロフェッショナルかつわかりやすく解説します。

現在対象企業: ${c.name}（${c.code}）
セクター: ${c.sector} / ${c.exchange}
売上成長率: ${c.revenueGrowth}%
営業利益率: ${c.operatingMargin}%
粗利率: ${c.grossMargin}%
${c.price ? `現在株価: ¥${c.price.toLocaleString('ja-JP')} (${c.changePercent > 0 ? '+' : ''}${c.changePercent}%)` : ''}
企業概要: ${c.description}

方針:
* 数字と根拠に基づく具体的な分析
* 日経新聞より深く、個人投資家にわかりやすい言葉で
* 強気・弱気を明確に表明する（曖昧にしない）
* 回答は200〜350字を目安に
* 重要ポイントは箇条書きで整理`;
  }

  async function sendChat(text) {
    const q = (text || chatInput).trim();
    if (!q || loading || !company) return;
    setChatMsgs(prev => [...prev, { role:'user', content:q }]);
    setChatInput('');
    setLoading(true);
    setStreaming('');
    try {
      let full = '';
      await streamChat({
        messages:     [...chatMsgs, { role:'user', content:q }],
        systemPrompt: buildSystemPrompt(company),
        apiKey,
        onChunk: t => { setStreaming(t); full = t; },
      });
      setChatMsgs(prev => [...prev, { role:'assistant', content:full }]);
      setStreaming('');
    } catch (e) {
      setStreaming(`⚠️ ${e.message}`);
      setTimeout(() => {
        setChatMsgs(prev => [...prev, { role:'assistant', content:`⚠️ ${e.message}` }]);
        setStreaming('');
      }, 100);
    }
    setLoading(false);
  }

  const REPORT_PROMPTS = {
    summary: c => `${c.name}（${c.code}）の最新決算について、投資家向け決算サマリーを作成してください。以下の構成で:\n## 業績ハイライト\n## 注目KPIと成長ドライバー\n## リスクと懸念点\n## 総合評価（強気/中立/弱気）と根拠\n数字を交えた具体的な内容にしてください。`,
    growth:  c => `${c.name}の「成長ポテンシャル分析」を作成してください:\n## ビジネスモデルの強み\n## 市場規模と浸透率\n## 競合優位性（経済的なモート）\n## 今後3年の成長シナリオ\n## 重要ウォッチポイント\n「なぜ長期保有に値するか or 値しないか」に明確に答えてください。`,
    risk:    c => `${c.name}の詳細なリスク分析を行ってください:\n## 事業固有リスク\n## 財務リスク\n## 競合・市場リスク\n## マクロ・規制リスク\n## 見落とされがちな隠れたリスク\n## リスク総合評価\n投資家が意識すべき最重要リスクを明確にしてください。`,
  };

  async function generateReport(type) {
    if (!company) return;
    setReportLoading(true);
    setReport('');
    setCurrentTab(type);
    if (stopRef.current) stopRef.current();

    try {
      let full = '';
      await streamChat({
        messages:     [{ role:'user', content: REPORT_PROMPTS[type](company) }],
        systemPrompt: buildSystemPrompt(company),
        apiKey,
        onChunk: t => { setReport(t); full = t; },
      });
    } catch (e) {
      setReport(`⚠️ ${e.message}`);
    }
    setReportLoading(false);
  }

  // ── ローディング画面 ────────────────────────────────────────────
  if (dataLoading) return (
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:16, background:C.bg }}>
      <Spinner size={32} />
      <div style={{ fontSize:14, color:C.textSecondary }}>Yahoo Finance からデータを取得中...</div>
      <div style={{ fontSize:11, color:C.textTertiary }}>初回は少し時間がかかります</div>
    </div>
  );

  if (dataError) return (
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12, background:C.bg, padding:20 }}>
      <div style={{ fontSize:32 }}>⚠️</div>
      <div style={{ fontSize:14, color:C.red, textAlign:'center', maxWidth:400 }}>{dataError}</div>
      <button onClick={fetchCompanies} style={{ marginTop:8, padding:'8px 20px', background:C.accent, border:'none', borderRadius:8, color:'white', cursor:'pointer', fontSize:13 }}>再接続</button>
    </div>
  );

  if (!company) return null;
  const rating = ratingConfig[company.rating] || ratingConfig.inline;

  // ── UI ─────────────────────────────────────────────────────────
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', background:C.bg }}>

      {settingsOpen && <SettingsModal apiKey={apiKey} onSave={saveApiKey} onClose={() => setSettingsOpen(false)} />}

      {/* ヘッダー */}
      <header style={{ height:52, borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', padding:'0 20px', gap:20, flexShrink:0, background:C.sidebar }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
          <span style={{ fontSize:18, fontWeight:700, color:C.accent, letterSpacing:'-0.3px' }}>決算レンズ</span>
          <span style={{ fontSize:10, color:C.textTertiary, letterSpacing:'0.06em' }}>AI ANALYST</span>
        </div>
        <nav style={{ display:'flex', gap:18, marginLeft:6 }}>
          {['決算速報','成長分析','セクター','ランキング'].map(n => (
            <span key={n} style={{ fontSize:12, color:C.textTertiary, cursor:'pointer' }}>{n}</span>
          ))}
        </nav>
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:14 }}>
          {/* 最終更新 + 手動リフレッシュ */}
          {lastUpdated && (
            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
              <span style={{ fontSize:10, color:C.textTertiary }}>
                更新: {new Date(lastUpdated).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
              </span>
              <button onClick={handleRefresh} disabled={refreshing} title="手動更新" style={{ background:'transparent', border:`0.5px solid ${C.border}`, borderRadius:6, padding:'2px 8px', color:C.textTertiary, cursor:'pointer', fontSize:10, display:'flex', alignItems:'center', gap:4 }}>
                {refreshing ? <Spinner size={10} /> : '↻'} 更新
              </button>
            </div>
          )}
          {/* APIキヾ態 */}
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <div style={{ width:7, height:7, borderRadius:'50%', background: apiKey ? C.green : C.red, animation: apiKey ? 'pulse 2s infinite' : 'none' }} />
            <span style={{ fontSize:11, color:C.textTertiary }}>{apiKey ? 'Claude 接続中' : 'APIキー未設定'}</span>
          </div>
          {/* 設定ボタン */}
          <button onClick={() => setSettingsOpen(true)} style={{ background:'transparent', border:`0.5px solid ${C.border}`, borderRadius:8, padding:'4px 10px', color:C.textSecondary, cursor:'pointer', fontSize:12 }}>
            ⚙️ 設定
          </button>
        </div>
      </header>

      <div style={{ display:'flex', flex:1, overflow:'hidden' }}>

        {/* サイドバー */}
        <aside style={{ width:222, borderRight:`0.5px solid ${C.border}`, background:C.sidebar, display:'flex', flexDirection:'column', flexShrink:0 }}>
          <div style={{ padding:'12px 14px 8px', fontSize:10, color:C.textTertiary, letterSpacing:'0.08em', fontWeight:500 }}>注目銘柄</div>
          {companies.map(c => {
            const r      = ratingConfig[c.rating] || ratingConfig.inline;
            const active = c.id === company.id;
            return (
              <div key={c.id} onClick={() => setCompany(c)} style={{ padding:'10px 14px', cursor:'pointer', borderLeft:`2px solid ${active ? C.accent : 'transparent'}`, background: active ? C.accentLight : 'transparent', transition:'all 0.15s' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:4 }}>
                  <div>
                    <div style={{ fontSize:13, fontWeight:500, color: active ? C.textPrimary : C.textSecondary, marginBottom:1 }}>{c.name}</div>
                    <div style={{ fontSize:10, color:C.textTertiary }}>
                      {c.code} · {c.sector}
                      {c.price && <span style={{ color: (c.changePercent||0) >= 0 ? C.green : C.red, marginLeft:6 }}>
                        {(c.changePercent||0) >= 0 ? '▲' : '▼'}{Math.abs(c.changePercent||0)}%
                      </span>}
                    </div>
                  </div>
                  <span style={{ fontSize:9, padding:'2px 7px', borderRadius:10, background:r.bg, color:r.color, fontWeight:500, flexShrink:0, marginTop:1 }}>{r.label}</span>
                </div>
                <ScoreBar score={c.score} />
              </div>
            );
          })}
          <div style={{ flex:1 }} />
          <div style={{ padding:'12px 14px', borderTop:`0.5px solid ${C.border}` }}>
            <div style={{ fontSize:10, color:C.textTertiary, marginBottom:5 }}>Powered by</div>
            <div style={{ fontSize:11, color:C.textSecondary, display:'flex', alignItems:'center', gap:6 }}>
              <div style={{ width:16, height:16, borderRadius:4, background:C.accentLight, border:`0.5px solid ${C.borderAccent}`, display:'flex', alignItems:'center', justifyContent:'center' }}>
                <div style={{ width:8, height:8, borderRadius:2, background:C.accent }} />
              </div>
              Claude Sonnet 4
            </div>
          </div>
        </aside>

        {/* メインコンテンツ */}
        <main style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>

          {/* 銘柄ヘッダー */}
          <div style={{ padding:'16px 20px', borderBottom:`0.5px solid ${C.border}`, background:C.card }}>
            <div style={{ display:'flex', alignItems:'flex-start', gap:16, marginBottom:14 }}>
              <div style={{ flex:1 }}>
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:5 }}>
                  <span style={{ fontSize:20, fontWeight:700 }}>{company.name}</span>
                  <span style={{ fontSize:12, color:C.textTertiary }}>{company.code} · {company.exchange}</span>
                  <span style={{ fontSize:10, padding:'2px 10px', borderRadius:10, background:rating.bg, color:rating.color, fontWeight:500 }}>{rating.label}</span>
                  {!company.liveData && <span style={{ fontSize:9, padding:'2px 8px', borderRadius:10, background:'rgba(255,255,255,0.05)', color:C.textTertiary }}>フォールバック</span>}
                </div>
                {company.price && (
                  <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:5 }}>
                    <span style={{ fontSize:22, fontWeight:600, color:C.textPrimary }}>¥{company.price.toLocaleString('ja-JP')}</span>
                    <span style={{ fontSize:13, color: (company.changePercent||0) >= 0 ? C.green : C.red, fontWeight:500 }}>
                      {(company.changePercent||0) >= 0 ? '▲' : '▼'} {Math.abs(company.changePercent||0)}%
                    </span>
                    {company.marketCap && <span style={{ fontSize:11, color:C.textTertiary }}>時価総額 {(company.marketCap/1e12).toFixed(2)}兆円</span>}
                  </div>
                )}
                <p style={{ fontSize:12, color:C.textTertiary, lineHeight:1.65, margin:0 }}>{company.description}</p>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
                <span style={{ fontSize:11, color:C.textTertiary }}>成長スコア</span>
                <span style={{ fontSize:26, fontWeight:600, color: company.score>=80 ? C.green : company.score>=65 ? C.accent : C.red }}>{company.score}</span>
              </div>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:8 }}>
              {(company.kpis||[]).map((k, i) => (
                <div key={i} style={{ background:'rgba(255,255,255,0.03)', borderRadius:8, padding:'8px 12px', border:`0.5px solid ${C.border}` }}>
                  <div style={{ fontSize:10, color:C.textTertiary, marginBottom:3 }}>{k.label}</div>
                  <div style={{ fontSize:16, fontWeight:500, lineHeight:1, marginBottom:3 }}>{k.value}</div>
                  <div style={{ fontSize:10, color: k.up ? C.green : C.red }}>{k.change}</div>
                </div>
              ))}
            </div>
          </div>

          {/* タブバー */}
          <div style={{ display:'flex', borderBottom:`0.5px solid ${C.border}`, background:C.card, padding:'0 20px', flexShrink:0 }}>
            {[
              { id:'chat',    label:'AIアナリストに質問' },
              { id:'summary', label:'決算サマリー自動生成' },
              { id:'growth',  label:'成長ポテンシャル分析' },
              { id:'risk',    label:'リスク分析' },
            ].map(t => (
              <button key={t.id} onClick={() => { setTab(t.id); if (t.id !== 'chat') generateReport(t.id); }}
                style={{ padding:'10px 16px', fontSize:12, color: tab===t.id ? C.accent : C.textTertiary, background:'transparent', border:'none', borderBottom:`2px solid ${tab===t.id ? C.accent : 'transparent'}`, cursor:'pointer', fontFamily:'inherit', marginBottom:-1, transition:'color 0.15s' }}>
                {t.label}
              </button>
            ))}
          </div>

          {/* コンテンツ */}
          <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>
            {tab === 'chat' ? (
              <>
                {/* チャットメッセージ */}
                <div style={{ flex:1, overflowY:'auto', padding:'16px 20px', display:'flex', flexDirection:'column', gap:16 }}>
                  {chatMsgs.length === 0 && !streaming && (
                    <div style={{ display:'flex', flexDirection:'column', gap:16, animation:'fadeIn 0.3s ease' }}>
                      <div style={{ textAlign:'center', padding:'28px 0 10px' }}>
                        <div style={{ width:44, height:44, borderRadius:12, background:C.accentLight, border:`0.5px solid ${C.borderAccent}`, margin:'0 auto 14px', display:'flex', alignItems:'center', justifyContent:'center' }}>
                          <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="10" r="8" stroke={C.accent} strokeWidth="1.2"/>
                            <path d="M7 10h6M10 7v6" stroke={C.accent} strokeWidth="1.2" strokeLinecap="round"/>
                          </svg>
                        </div>
                        <div style={{ fontSize:14, fontWeight:500, color:C.textSecondary, marginBottom:4 }}>{company.name}についてAIアナリストに質問</div>
                        <div style={{ fontSize:12, color:C.textTertiary }}>決算・財務・成長性・競合・リスクなど何でも聞けます</div>
                        {!apiKey && (
                          <div style={{ marginTop:12, fontSize:12, color:C.red, background:C.redLight, padding:'8px 16px', borderRadius:8, display:'inline-block' }}>
                            ⚠️ Claude API キーが未設定です —{' '}
                            <span style={{ textDecoration:'underline', cursor:'pointer' }} onClick={() => setSettingsOpen(true)}>設定する</span>
                          </div>
                        )}
                      </div>
                      <div style={{ display:'flex', flexWrap:'wrap', gap:6, justifyContent:'center' }}>
                        {QUICK_QUESTIONS.map((q, i) => (
                          <button key={i} onClick={() => sendChat(q)}
                            style={{ fontSize:11, padding:'6px 14px', borderRadius:20, background:'transparent', border:`0.5px solid ${C.border}`, color:C.textSecondary, cursor:'pointer', fontFamily:'inherit', transition:'all 0.15s' }}
                            onMouseEnter={e => { e.currentTarget.style.borderColor=C.accent; e.currentTarget.style.color=C.accent; }}
                            onMouseLeave={e => { e.currentTarget.style.borderColor=C.border;  e.currentTarget.style.color=C.textSecondary; }}>
                            {q}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {chatMsgs.map((m, i) => (
                    <div key={i} style={{ display:'flex', gap:12, justifyContent: m.role==='user' ? 'flex-end' : 'flex-start', animation:'fadeIn 0.2s ease' }}>
                      {m.role === 'assistant' && (
                        <div style={{ width:28, height:28, borderRadius:8, background:C.accentLight, border:`0.5px solid ${C.borderAccent}`, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', marginTop:2 }}>
                          <div style={{ width:10, height:10, borderRadius:3, background:C.accent }} />
                        </div>
                      )}
                      <div style={{ maxWidth:'78%', padding:'10px 14px', borderRadius: m.role==='user' ? '14px 4px 14px 14px' : '4px 14px 14px 14px', background: m.role==='user' ? C.accentLight : C.card, border:`0.5px solid ${m.role==='user' ? C.borderAccent : C.border}` }}>
                        {m.role === 'user'
                          ? <p style={{ margin:0, fontSize:13, color:C.textPrimary, lineHeight:1.65 }}>{m.content}</p>
                          : <MD text={m.content} />
                        }
                      </div>
                    </div>
                  ))}

                  {streaming && (
                    <div style={{ display:'flex', gap:12, animation:'fadeIn 0.2s ease' }}>
                      <div style={{ width:28, height:28, borderRadius:8, background:C.accentLight, border:`0.5px solid ${C.borderAccent}`, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', marginTop:2 }}>
                        <div style={{ width:10, height:10, borderRadius:3, background:C.accent }} />
                      </div>
                      <div style={{ maxWidth:'78%', padding:'10px 14px', borderRadius:'4px 14px 14px 14px', background:C.card, border:`0.5px solid ${C.border}` }}>
                        <MD text={streaming} /><Cursor />
                      </div>
                    </div>
                  )}
                  <div ref={bottomRef} />
                </div>

                {/* 入力フォーム */}
                <div style={{ padding:'12px 20px 16px', borderTop:`0.5px solid ${C.border}`, background:C.card }}>
                  <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                    <div style={{ flex:1, background:'rgba(255,255,255,0.04)', border:`0.5px solid ${C.border}`, borderRadius:12, padding:'10px 14px' }}>
                      <input value={chatInput} onChange={e => setChatInput(e.target.value)}
                        onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } }}
                        placeholder={`${company.name}について質問する...`}
                        style={{ width:'100%', background:'transparent', border:'none', outline:'none', color:C.textPrimary, fontSize:13, fontFamily:'inherit' }}
                      />
                    </div>
                    <button onClick={() => sendChat()} disabled={loading || !chatInput.trim()}
                      style={{ width:40, height:40, borderRadius:10, background: loading||!chatInput.trim() ? 'rgba(255,255,255,0.06)' : C.accent, border:'none', cursor: loading||!chatInput.trim() ? 'not-allowed' : 'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s', flexShrink:0 }}>
                      {loading
                        ? <Spinner size={14} color="rgba(255,255,255,0.8)" />
                        : <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      }
                    </button>
                  </div>
                </div>
              </>
            ) : (
              /* レポートタブ */
              <div style={{ flex:1, overflowY:'auto', padding:20 }}>
                {reportLoading && !report && (
                  <div style={{ display:'flex', alignItems:'center', gap:12, padding:'20px 0' }}>
                    <Spinner size={20} />
                    <span style={{ fontSize:13, color:C.textSecondary }}>{company.name}の分析を生成中...</span>
                  </div>
                )}
                {!apiKey && !reportLoading && !report && (
                  <div style={{ padding:20, background:C.redLight, borderRadius:12, border:`0.5px solid ${C.red}`, fontSize:13, color:C.red }}>
                    ⚠️ Claude API キーが未設定です。
                    <span style={{ textDecoration:'underline', cursor:'pointer', marginLeft:6 }} onClick={() => setSettingsOpen(true)}>設定する →</span>
                  </div>
                )}
                {report && (
                  <div style={{ background:C.card, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'20px 22px', animation:'fadeIn 0.3s ease' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16, paddingBottom:12, borderBottom:`0.5px solid ${C.border}` }}>
                      <div style={{ width:24, height:24, borderRadius:6, background:C.accentLight, border:`0.5px solid ${C.borderAccent}`, display:'flex', alignItems:'center', justifyContent:'center' }}>
                        <div style={{ width:8, height:8, borderRadius:2, background:C.accent }} />
                      </div>
                      <span style={{ fontSize:12, color:C.textSecondary }}>AIアナリスト · {company.name}</span>
                      {reportLoading && <Cursor />}
                    </div>
                    <MD text={report} />
                    {reportLoading && <Cursor />}
                  </div>
                )}
              </div>
            )}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<KesshoApp />);
</script>
</body>
</html>
