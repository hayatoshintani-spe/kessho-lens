# Render Blueprint - One-click deploy from this repo
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tsuburaya-intel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_CARDS_DB_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BRIEF_EMAIL_FROM
        sync: false
      - key: BRIEF_EMAIL_RECIPIENTS
        sync: false
      - key: BRIEF_TIMEZONE
        value: Asia/Tokyo

# 日次配信のスケジューラは Vercel Cron (vercel.json の /api/cron/daily-brief) が担当。
# Render の Cron サービスは無料プラン非対応のため Blueprint からは除外している。
# Render Cron を使いたい場合は plan: starter 以上に変更して以下を再追加:
#   - type: cron
#     name: tsuburaya-intel-daily-brief
#     plan: starter
#     schedule: "0 22 * * *"
#     ...
