name: TOEIC App CI

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "frontend-toeic/**"
      - ".github/workflows/toeic-ci.yml"
  pull_request:
    paths:
      - "frontend-toeic/**"
      - ".github/workflows/toeic-ci.yml"

permissions:
  contents: read

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-toeic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-toeic/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: npm run type-check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-toeic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-toeic/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run vitest
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, test]
    defaults:
      run:
        working-directory: frontend-toeic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-toeic/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Next.js build
        run: npm run build
        env:
          # Placeholder values: the Supabase client modules fall back to these
          # so `next build` can statically analyze pages. Real values are set
          # at deploy time (Vercel) or via .env.local locally.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
